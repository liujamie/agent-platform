services:
  # ─── 后端 API 服务 ───
  agent-platform:
    build: .
    container_name: agent-platform
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root123
      - MYSQL_DATABASE=agent_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - agent-network
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── 前端 SPA（nginx）───
  frontend:
    build: ./frontend
    container_name: agent-platform-frontend
    ports:
      - "80:80"               # 浏览器访问 http://localhost
    depends_on:
      - agent-platform
    restart: unless-stopped
    networks:
      - agent-network
    logging: *default-logging

  mysql:
    image: mysql:8.0
    container_name: agent-platform-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: agent_platform
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - D:/mydata/agent-platform-local-data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agent-network
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: agent-platform-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - D:/mydata/agent-platform-local-data/redis:/data
    networks:
      - agent-network
    logging: *default-logging



networks:
  agent-network:
    driver: bridge
